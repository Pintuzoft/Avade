#
# AvadeMailer REFERENCE config.
#
# This file explains every setting of the mailer. Use mailer-template.conf as
# the start of your own mailer.conf. "Mail" in INSTALL tells how the mailer
# is set up and run.
#
# Avade does not send mail itself. When services want to send a mail (to
# confirm the mail address of a new nick, a new address or a new password, or
# the code of /NickServ RESETPASS) the mail is put in the mailbox table of
# the database with status 1. The mailer is a program of its own that looks
# in the mailbox, sends what is waiting and sets the status. Services never
# wait for a mail server, and the mailer can be restarted or moved to another
# machine on its own.
#
# The mailer does not need the secretsalt of services.conf, and should not
# have it: the mailbox has the address of each mail in clear.
#
---
# SEND :
#
#    true: the mails are sent.
#    false: nothing is sent. Every mail is only marked as not sent (status 3)
#    and logged. Use false on a test network that has a copy of real data, the
#    addresses in it belong to real people.
#
send: false

# LOGFILE :
#
#    One line per mail: its id and subject, never the address or the text
#    (the text can hold codes). To find the address of a mail, look it up by
#    id in the mailbox table.
#
logfile: mailer.log

# INTERVAL :
#
#    Seconds between looks in the mailbox.
#
interval: 5

# RATE :
#
#    At most this many mails a second. Amazon SES allows 14 a second by
#    default, and 1 while the account is in the SES sandbox.
#
rate: 10

# RETRIES :
#
#    A mail the mail server turns away for now (an answer 4xx) is tried this
#    many times, then it is marked failed (status 500). A mail the server
#    refuses (5xx) fails at once. Failed mails are sent again with
#    "./avade.sh mailer resend <id|failed>".
#
retries: 5

# MYSQL :
#
#    The database of services, the same names as in services.conf. The mailer
#    only reads and updates the mailbox table, so give it a user of its own
#    that can do nothing else:
#
#      grant select, update, delete on avade.mailbox to 'mailer'@'localhost' identified by 'MAILERPASS';
#
# MYSQLHOST : The host of the database. When the mailer runs on another
#             machine than the database, the grant above needs that host
#             instead of localhost.
#
# MYSQLPORT : The port of the database, usually 3306.
#
# MYSQLUSER : The user the mailer logs in with.
#
# MYSQLPASS : The password of that user.
#
#   MYSQLDB : The name of the database.
#
mysqlhost: localhost
mysqlport: 3306
mysqluser: mailer
mysqlpass: CHANGE-THIS
mysqldb: avade

# SMTP :
#
#    The mail server the mails are handed to.
#
# SMTPHOST : The mail server.
#            Amazon SES: email-smtp.<region>.amazonaws.com
#            A mail server on the same machine (postfix, sendmail): localhost
#
# SMTPPORT : 587 for a server that wants STARTTLS and a login (SES), 25 for a
#            mail server on the same machine.
#
#  SMTPTLS : true: STARTTLS is required, and the certificate must be valid
#            for SMTPHOST. Nothing is sent over a connection that is not
#            encrypted. Use false only for a mail server on the same machine.
#
# SMTPAUTH : true: log in with SMTPUSER and SMTPPASS.
#
# SMTPUSER : The login of the mail server. With SES these are the SMTP
# SMTPPASS : credentials made in the SES console, not the AWS access keys.
#
# SMTPFROM : The sender of the mails. With SES the address, or its domain,
#            must be verified.
#
smtphost: smtp.example.net
smtpport: 587
smtptls: true
smtpauth: true
smtpuser: CHANGE-THIS
smtppass: CHANGE-THIS
smtpfrom: noreply@example.net
