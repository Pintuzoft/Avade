#
# Avade Services config.
#
# In this file the settings of services is stored and read by Avade
# services. please read the reference.conf for information about all
# available options.
#
# ./DreamHealer
#
---
name: services.example.net
domain: example.net
netname: ExampleNET
stats: stats.example.net
master: YourNick
authurl: https://example.net/auth/
logfile: services.log
expire: 30d
secretsalt: CHANGE-THIS-to-something-long-and-random
forcemodes: true

hubname: hub.example.net
hubhost: 127.0.0.1
hubport: 7015
hubpass: CHANGE-THIS

mysqlhost: localhost
mysqlport: 3306
mysqluser: services
mysqlpass: CHANGE-THIS
mysqldb: avade

serviceuser: service
servicehost: example.net
servicegcos: Avade IRC Services

triggerwarn: true
triggeraction: kill
triggerwarnip: 2
triggerwarnrange: 20
triggeractionip: 10
triggeractionrange: 150

snooprootserv: "#Snoop"
snoopoperserv: "#Snoop"
snoopnickserv: "#Snoop"
snoopchanserv: "#Snoop"
snoopmemoserv: "#Snoop"

whitelist:
 - 127.0.0.1
 - localhost

# Optional, see reference.conf:
#vhostforbidden:
# - "*admin*"
# - "*oper*"
#uhmsalt:
#uhmprefix: user

sra:
 - jupe
 - stop
 - panic
 - rehash
 - sraw
 - uinfo
 - cinfo
 - ninfo
 - sinfo
 - ulist
 - clist
 - slist
 - delete
 - snooplog
 - showconfig
 - sra
 - uhm
 - sjr

csop:
 - sqline
 - sgline
 - close
 - freeze
 - hold
 - mark
 - setpass
 - getemail
 - noghost

sa:
 - akill
 - banlog
 - global
 - ignore
 - audit
 - server
 - chanlist
 - list
 - auditorium
 - topiclog
 - spamfilter
 - forcenick
 - vhost
 - clone
 - makill

ircop:
 - staff
 - searchlog
 - uptime
 - comment
 - bahamut
