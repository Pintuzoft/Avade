#
# AvadeMailer config.
#
# Copy this file to mailer.conf next to mailer.jar and set the values.
# Every setting is explained in mailer-reference.conf, and "Mail" in INSTALL
# tells how the mailer is set up. Keep mailer.conf readable for its owner
# only (chmod 600), it holds passwords.
#
---
send: false
logfile: mailer.log
interval: 5
rate: 10
retries: 5

mysqlhost: localhost
mysqlport: 3306
mysqluser: mailer
mysqlpass: CHANGE-THIS
mysqldb: avade

smtphost: smtp.example.net
smtpport: 587
smtptls: true
smtpauth: true
smtpuser: CHANGE-THIS
smtppass: CHANGE-THIS
smtpfrom: noreply@example.net
