# AvadeMailer
#
#    Avade does not send mail itself. When services want to send a mail (a new
#    nick, a new mail address or password to confirm, RESETPASS, a new memo) the
#    mail is put in the mailbox table of the database, with status 1. The
#    mailer is a program of its own that looks in the mailbox, sends what is
#    waiting and sets the status. Services never wait for a mail server, and the
#    mailer can be restarted or moved to another machine on its own.
#
#    Copy this file to mailer.conf next to mailer.jar (./make.sh install puts
#    both in ~/avade/) and start it with: ./avade.sh mailer start
#    See "Mail" in INSTALL.
#
#    The mailer does not need secretsalt: the mailbox has the addresses in clear.
#    Keep this file readable for its owner only (chmod 600), it holds passwords.

# SEND :
#
#    true: the mails are sent. false: nothing is sent, every mail is only marked
#    as not sent (status 3) and logged. Use false on a test network that has a
#    copy of real data, the addresses in it belong to real people.
#
send: false

# LOGFILE : one line per mail (id and subject, never the address or the text)
logfile: mailer.log

# INTERVAL : seconds between looks in the mailbox
interval: 5

# RATE : at most this many mails a second. Amazon SES allows 14 by default,
#        1 while the account is in the SES sandbox
rate: 10

# RETRIES : a mail the server turns away for now (4xx) is tried this many times,
#           then it is marked failed. One the server refuses (5xx) fails at once
retries: 5

# MYSQL : the same database as in services.conf. The mailer only reads and
#         updates the mailbox table, so its own user with only that is enough:
#           grant select, update, delete on avade.mailbox to 'mailer'@'localhost'
#
mysql:
  host: localhost
  port: 3306
  user: mailer
  pass: mailerpass
  db: avade

# SMTP :
#
#    HOST, PORT : the mail server. Amazon SES: email-smtp.<region>.amazonaws.com,
#                 port 587. A mail server on the same machine: localhost, port 25
#    TLS        : true: STARTTLS is required and the certificate must be valid
#                 for the host. false only for a mail server on the same machine
#    AUTH       : true: log in with USER and PASS (for SES the SMTP credentials,
#                 not the AWS access keys)
#    FROM       : the sender. With SES the address or its domain must be verified
#
smtp:
  host: email-smtp.eu-north-1.amazonaws.com
  port: 587
  tls: true
  auth: true
  user:
  pass:
  from: noreply@example.net
